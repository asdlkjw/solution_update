[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "math-problem-fixer"
version = "0.1.0"
description = "AI-powered math problem correction tool using OpenRouter Gemini"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymysql>=1.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "tqdm>=4.66.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.2",
    "pydantic>=2.5.0",
]

[tool.setuptools]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0"
]
